.e-abierto{background:#2f6f5e}.e-cerrado{background:#8a8f8c}.e-pronto{background:#d08a3c}

.tile{background:var(--accent);color:#0f2f4d;border:0;border-radius:16px;padding:1rem .6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}.tile span{font-size:2rem}.tile b{font-family:'Fredoka',system-ui}.tile small{opacity:.85}

.b{border:1px solid var(--accent);background:var(--accent);color:#0f2f4d;border-radius:10px;padding:.4rem .8rem;cursor:pointer}
.b.p{background:var(--accent);color:#0f2f4d;border-color:var(--accent)}.adm{margin-top:.6rem}
.mas{border:2px dashed var(--c,var(--accent));background:transparent;color:var(--c,var(--accent));border-radius:14px;min-height:80px;cursor:pointer}

#modal.on{display:flex}#caja{background:var(--card);border-radius:16px;padding:1.2rem;width:100%;max-width:440px;max-height:90%;overflow:auto}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===== CONFIGURACIÓN ===== */
const MAX=100;
/* Para que los cambios se vean en todos los dispositivos, rellena estas dos líneas con los datos de tu proyecto de Supabase */
const SB_URL="https://doimazoavcpefugfjfzc.supabase.co", SB_KEY="sb_publishable__eTIChyoIjw7gaZeTuMNpw_g3xcHS0T";
let TOK=null;
const NOMBRES=["Actividades","Cursos","Trabajo","Voluntariado","Beca","Concurso"];
const EU=["Jarduerak","Ikastaroak","Lana","Boluntariotza","Beka","Lehiaketa"];
const EMO=["","","","","",""], COL=["#70449a","#f08a32","#e3b72f","#51418c","#e46f45","#8a5aa7"], PRE=["A","CU","T","V","B","CO"];
const INTRO={es:["Lo que se hace en la ikastola.","Cursos y formaciones.","Ofertas y trabajos.","Oportunidades de voluntariado.","Becas y ayudas.","Concursos abiertos."],eu:["Ikastolan egiten dena.","Ikastaroak eta prestakuntzak.","Lan eskaintzak.","Boluntariotza aukerak.","Bekak eta laguntzak.","Lehiaketa irekiak."]};
const TX={es:{sub:"Actividades, cursos, becas y más: todo en un solo sitio.",ini:"Inicio",nov:"Novedades",vacio:"Aún no hay temas aquí.",nada:"Sin resultados.",vol:"← Volver",mas:"Más información",bus:"Buscar…",comp:"Compartir",noimg:"Aún no hay imágenes.",hasta:"Hasta",abierto:"Plazo abierto",cerrado:"Cerrado",pronto:"Próximamente",qr:"Comparte esta web",qrt:"Escanea el código QR para abrirla en el móvil.",cart:"Imprimir cartel QR",copiado:"Enlace copiado",esc:"Escanea para ver todas las actividades"},
eu:{sub:"Jarduerak, ikastaroak, bekak eta gehiago: dena leku batean.",ini:"Hasiera",nov:"Berriak",vacio:"Oraindik ez dago ezer hemen.",nada:"Emaitzarik ez.",vol:"← Itzuli",mas:"Informazio gehiago",bus:"Bilatu…",comp:"Partekatu",noimg:"Oraindik ez dago irudirik.",hasta:"Epea",abierto:"Epea irekita",cerrado:"Itxita",pronto:"Laster",qr:"Partekatu web hau",qrt:"Eskaneatu QR kodea mugikorrean irekitzeko.",cart:"Inprimatu QR kartela",copiado:"Esteka kopiatuta",esc:"Eskaneatu jarduera guztiak ikusteko"}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let D=JSON.parse($("datos").textContent),cur=-1,ver=null,admin=false,q="",lang="es",zl=[],zi=0;
try{lang=localStorage.getItem("ik_lang")||"es";}catch(e){}
if(!SB_URL)try{const g=localStorage.getItem("ik_borrador");if(g&&sessionStorage.getItem("ik_admin")==="1"){D=JSON.parse(g);admin=true;}}catch(e){}
NOMBRES.forEach(n=>{if(!Array.isArray(D[n]))D[n]=[];});
D._cfg=Object.assign({nombre:"Jaso Ikastola",color:"#70449a",logo:""},D._cfg||{});
const t=k=>TX[lang][k], nom=i=>lang==="eu"?EU[i]:NOMBRES[i];
const tx=(w,f)=>lang==="eu"&&w[f+"_eu"]?w[f+"_eu"]:w[f];
let tg;function guarda(){if(SB_URL){clearTimeout(tg);tg=setTimeout(nube,600);return;}try{localStorage.setItem("ik_borrador",JSON.stringify(D));}catch(e){}}
async function nube(){if(!TOK){aviso("Sin sesión de administrador");return;}try{const r=await fetch(SB_URL+"/rest/v1/web?on_conflict=id",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+TOK,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},body:JSON.stringify({id:1,data:D})});aviso(r.ok?"Guardado en la nube":r.status===401?"Sesión caducada: sal y vuelve a entrar":"Error al guardar ("+r.status+")");}catch(e){aviso("Error de conexión");}}
async function carga(){try{const r=await fetch(SB_URL+"/rest/v1/web?id=eq.1&select=data",{headers:{apikey:SB_KEY}});if(!r.ok){aviso("No se pudo leer la nube ("+r.status+")");return;}const j=await r.json();if(!j[0]){aviso("La nube está vacía: guarda algo como administrador");return;}if(j[0]&&j[0].data){D=j[0].data;NOMBRES.forEach(n=>{if(!Array.isArray(D[n]))D[n]=[];});D._cfg=Object.assign({nombre:"Jaso Ikastola",color:"#70449a",logo:""},D._cfg||{});pinta();}}catch(e){aviso("Error de conexión con la nube");}}
function cerrar(){$("modal").classList.remove("on");}
function aviso(m){const e=$("toast");e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",4000);}
function reduce(f,max,tipo){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL(tipo||"image/jpeg",.72));};im.onerror=()=>ok(null);im.src=r.result;};r.onerror=()=>ok(null);r.readAsDataURL(f);});}
function chip(w){return w.estado?"<span class='chip e-"+w.estado+"'>"+t(w.estado)+"</span>"+(w.limite?"<span class='f'>"+t("hasta")+": "+esc(w.limite)+"</span>":""):"";}
function cab(){
  document.documentElement.style.setProperty("--accent",D._cfg.color);document.documentElement.lang=lang;
  $("hdr").innerHTML="<div class='hd'>"+(D._cfg.logo?"<img src='"+esc(D._cfg.logo)+"' alt=''>":"")+"<div><h1>"+esc(D._cfg.nombre)+"</h1><p>"+t("sub")+"</p></div><button class='b' id='lgb'>"+(lang==="es"?"EU":"ES")+"</button></div>";
  $("lgb").onclick=()=>{lang=lang==="es"?"eu":"es";try{localStorage.setItem("ik_lang",lang);}catch(e){}pinta();};
  $("q").placeholder=t("bus");$("qrh").textContent=t("qr");$("qrt").textContent=t("qrt");$("cartbtn").textContent=t("cart");
}
function nav(){
  $("nav").innerHTML="";
  [[t("ini"),-1,"var(--accent)"]].concat(NOMBRES.map((n,i)=>[nom(i),i,COL[i]])).forEach(a=>{
    const b=document.createElement("button");b.textContent=a[0];b.className=a[1]===cur?"on":"";
    b.onclick=()=>{cur=a[1];ver=null;q="";$("q").value="";pinta();};$("nav").appendChild(b);});
}
function tarjeta(w,s,i){return "<article class='tema clic' style='--c:"+COL[s]+"' data-s='"+s+"' data-v='"+i+"'>"+(w.imgs&&w.imgs[0]?"<img class='portada' src='"+esc(w.imgs[0].src)+"' alt=''>":"")+"<h3><span class='cod'>"+PRE[s]+(i+1)+"</span>"+esc(tx(w,"titulo"))+"</h3>"+chip(w)+"<div class='f'>"+esc(w.fecha)+"</div><p>"+esc(tx(w,"texto"))+"</p>"+(admin&&cur===s&&!q?"<div class='adm'><button class='b' data-e='"+i+"'>Editar</button></div>":"")+"</article>";}
function seccion(){const n=NOMBRES[cur],L=D[n];
  let h="<h2>"+nom(cur)+"</h2><p class='intro'>"+INTRO[lang][cur]+"</p>";
  if(!L.length&&!admin)h+="<div class='vacio'>"+t("vacio")+"</div>";
  h+="<div class='grid'>"+L.map((w,i)=>tarjeta(w,cur,i)).join("");
  if(admin&&L.length<MAX)h+="<button class='mas' data-e='nuevo'>+ Añadir ventana ("+L.length+"/"+MAX+")</button>";
  return h+"</div>";}
function inicio(){
  let h="<div class='tiles'>"+NOMBRES.map((n,i)=>"<button class='tile' data-g='"+i+"'><b>"+nom(i)+"</b><small>"+D[n].length+"</small></button>").join("")+"</div>";
  const nv=[];NOMBRES.forEach((n,s)=>D[n].forEach((w,i)=>{if(w.alta)nv.push({w,s,i});}));nv.sort((a,b)=>b.w.alta-a.w.alta);
  return h+"<h2>"+t("nov")+"</h2>"+(nv.length?"<div class='grid'>"+nv.slice(0,6).map(o=>tarjeta(o.w,o.s,o.i)).join("")+"</div>":"<div class='vacio'>"+t("vacio")+"</div>");}
function resultados(){const s=q.trim().toLowerCase(),r=[];
  NOMBRES.forEach((n,si)=>D[n].forEach((w,i)=>{if([w.titulo,w.titulo_eu,w.texto,w.texto_eu].join(" ").toLowerCase().includes(s))r.push(tarjeta(w,si,i));}));
  return "<h2>"+esc(q)+"</h2>"+(r.length?"<div class='grid'>"+r.join("")+"</div>":"<div class='vacio'>"+t("nada")+"</div>");}
function detalle(){const w=D[NOMBRES[cur]][ver];w.imgs=w.imgs||[];
  let h="<p><button class='b' id='vol'>"+t("vol")+"</button> <button class='b' id='comp'>"+t("comp")+"</button></p><h2 style='color:"+COL[cur]+"'><span class='cod' style='--c:"+COL[cur]+"'>"+PRE[cur]+(ver+1)+"</span>"+esc(tx(w,"titulo"))+"</h2><p>"+chip(w)+"</p><div class='f'>"+esc(w.fecha)+"</div><p>"+esc(tx(w,"texto"))+"</p>"
   +(w.enlace?"<p><a style='color:#1d4f7c' href='"+esc(w.enlace)+"' target='_blank' rel='noopener'>"+t("mas")+"</a></p>":"");
  if(admin)h+="<p><button class='b p' id='addimg'>+ Subir imágenes</button> <button class='b' id='addurl'>+ Imagen por enlace</button><input type='file' id='fil' accept='image/*' multiple hidden></p>";
  if(!w.imgs.length)h+="<div class='vacio'>"+t("noimg")+"</div>";
  h+="<div class='gal'>"+w.imgs.map((m,i)=>"<figure><img src='"+esc(m.src)+"' data-z='"+i+"' alt=''><figcaption>"+esc(m.pie)+(admin?"<div class='adm'><button class='b' data-p='"+i+"'>Info / quitar</button></div>":"")+"</figcaption></figure>").join("")+"</div>";
  return h;}
function bindDet(){const w=D[NOMBRES[cur]][ver];
  $("vol").onclick=()=>{ver=null;pinta();};
  $("comp").onclick=async()=>{const u=location.href;try{if(navigator.share){await navigator.share({title:tx(w,"titulo"),url:u});return;}await navigator.clipboard.writeText(u);aviso(t("copiado"));}catch(e){}};
  $("main").querySelectorAll("[data-z]").forEach(im=>im.onclick=()=>{zl=w.imgs.map(m=>m.src);zoom(+im.dataset.z);});
  if(!admin)return;
  $("addimg").onclick=()=>$("fil").click();
  $("fil").onchange=async e=>{for(const f of e.target.files){const s=await reduce(f,1000);if(s)w.imgs.push({src:s,pie:""});}guarda();pinta();};
  $("addurl").onclick=()=>{$("caja").innerHTML="<h3>Imagen por enlace</h3><label>Dirección de la imagen</label><input id='u' placeholder='https://...'><div class='row'><button class='b p' id='ok'>Añadir</button><button class='b' id='no'>Cancelar</button></div>";$("modal").classList.add("on");$("no").onclick=cerrar;$("ok").onclick=()=>{const u=$("u").value.trim();if(u){w.imgs.push({src:u,pie:""});guarda();cerrar();pinta();}};};
  $("main").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const i=+b.dataset.p;$("caja").innerHTML="<h3>Información de la imagen</h3><label>Texto</label><textarea id='pie' rows='4'>"+esc(w.imgs[i].pie)+"</textarea><div class='row'><button class='b p' id='ok'>Guardar</button><button class='b' id='no'>Cancelar</button><button class='b' id='qt'>Quitar imagen</button></div>";$("modal").classList.add("on");$("no").onclick=cerrar;$("ok").onclick=()=>{w.imgs[i].pie=$("pie").value.trim();guarda();cerrar();pinta();};$("qt").onclick=()=>{if($("qt").dataset.s){w.imgs.splice(i,1);guarda();cerrar();pinta();}else{$("qt").dataset.s=1;$("qt").textContent="¿Seguro? Pulsa otra vez";}};});}
function zoom(i){zi=(i+zl.length)%zl.length;const m=zl.length>1;
  $("zoom").innerHTML=(m?"<button class='zb zl' id='zp'>‹</button>":"")+"<img src='"+esc(zl[zi])+"'>"+(m?"<button class='zb zr' id='zn'>›</button>":"");
  $("zoom").classList.add("on");
  if(m){$("zp").onclick=e=>{e.stopPropagation();zoom(zi-1);};$("zn").onclick=e=>{e.stopPropagation();zoom(zi+1);};}
  $("zoom").onclick=()=>{$("zoom").classList.remove("on");$("zoom").innerHTML="";};}
document.addEventListener("keydown",e=>{if(!$("zoom").classList.contains("on"))return;if(e.key==="Escape")$("zoom").onclick();if(e.key==="ArrowLeft")zoom(zi-1);if(e.key==="ArrowRight")zoom(zi+1);});
function barra(){
  $("bar").innerHTML=admin?"<span class='f'>"+(SB_URL?"Administrador (nube conectada)":"MODO LOCAL: los cambios NO se ven en otros dispositivos")+"</span><button class='b p' id='exp'>Descargar web actualizada</button><button class='b' id='aju'>Ajustes</button><button class='b' id='sal'>Salir</button>":"";
  if(!admin)return;
  $("exp").onclick=exportar;$("sal").onclick=()=>{admin=false;TOK=null;try{sessionStorage.removeItem("ik_admin");}catch(e){}pinta();};
  $("aju").onclick=()=>{$("caja").innerHTML="<h3>Ajustes de la web</h3><label>Nombre</label><input id='a1' value=\""+esc(D._cfg.nombre)+"\"><label>Color principal</label><input id='a2' type='color' value='"+D._cfg.color+"'><label>Logo (imagen)</label><input id='a3' type='file' accept='image/*'><div class='row'><button class='b p' id='ok'>Guardar</button><button class='b' id='no'>Cancelar</button></div>";$("modal").classList.add("on");$("no").onclick=cerrar;
    $("ok").onclick=async()=>{D._cfg.nombre=$("a1").value.trim()||D._cfg.nombre;D._cfg.color=$("a2").value;const f=$("a3").files[0];if(f){const s=await reduce(f,300,"image/png");if(s)D._cfg.logo=s;}guarda();cerrar();pinta();};};}
function editar(k){
  const n=NOMBRES[cur],nuevo=k==="nuevo",w=nuevo?{titulo:"",titulo_eu:"",fecha:"",texto:"",texto_eu:"",enlace:"",estado:"",limite:""}:D[n][+k],E=w.estado||"";
  $("caja").innerHTML="<h3>"+(nuevo?"Nueva ventana":"Editar ventana")+"</h3>"
   +"<label>Título (castellano)</label><input id='f1' value=\""+esc(w.titulo)+"\"><label>Título (euskera, opcional)</label><input id='f5' value=\""+esc(w.titulo_eu)+"\">"
   +"<label>Estado</label><select id='f6'><option value=''>— ninguno —</option><option value='abierto'"+(E==="abierto"?" selected":"")+">Plazo abierto</option><option value='cerrado'"+(E==="cerrado"?" selected":"")+">Cerrado</option><option value='pronto'"+(E==="pronto"?" selected":"")+">Próximamente</option></select>"
   +"<label>Fecha límite</label><input id='f7' type='date' value='"+esc(w.limite)+"'><label>Fecha de la noticia</label><input id='f2' value=\""+esc(w.fecha)+"\" placeholder='2026-11-16'>"
   +"<label>Texto (castellano)</label><textarea id='f3' rows='4'>"+esc(w.texto)+"</textarea><label>Texto (euskera, opcional)</label><textarea id='f8' rows='4'>"+esc(w.texto_eu)+"</textarea>"
   +"<label>Enlace (opcional)</label><input id='f4' value=\""+esc(w.enlace)+"\" placeholder='https://...'>"
   +"<div class='row'><button class='b p' id='ok'>Guardar</button><button class='b' id='no'>Cancelar</button>"+(nuevo?"":"<button class='b' id='del'>Borrar</button>")+"</div>";
  $("modal").classList.add("on");$("no").onclick=cerrar;
  $("ok").onclick=()=>{const v={titulo:$("f1").value.trim(),titulo_eu:$("f5").value.trim(),estado:$("f6").value,limite:$("f7").value,fecha:$("f2").value.trim(),texto:$("f3").value.trim(),texto_eu:$("f8").value.trim(),enlace:$("f4").value.trim()};
    if(!v.titulo)return;if(nuevo){v.imgs=[];v.alta=Date.now();D[n].push(v);}else Object.assign(D[n][+k],v);guarda();cerrar();pinta();};
  if(!nuevo)$("del").onclick=()=>{if($("del").dataset.s){D[n].splice(+k,1);guarda();cerrar();pinta();}else{$("del").dataset.s=1;$("del").textContent="¿Seguro? Pulsa otra vez";}};}
function pinta(){
  cab();nav();
  const bus=q.trim().length>0,det=!bus&&cur>=0&&ver!==null&&D[NOMBRES[cur]][ver];
  $("main").innerHTML=bus?resultados():cur===-1?inicio():det?detalle():seccion();
  $("main").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editar(b.dataset.e));
  $("main").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{cur=+b.dataset.g;ver=null;pinta();});
  $("main").querySelectorAll("[data-v]").forEach(a=>a.onclick=e=>{if(e.target.closest("button,a"))return;cur=+a.dataset.s;ver=+a.dataset.v;q="";$("q").value="";pinta();window.scrollTo(0,0);});
  if(det)bindDet();
  barra();
  try{history.replaceState(null,"","#"+(cur<0?"inicio":NOMBRES[cur].toLowerCase()+(ver!==null?"-"+(ver+1):"")));}catch(e){}
}
$("q").oninput=e=>{q=e.target.value;ver=null;pinta();};
$("adminbtn").onclick=()=>{
  if(admin)return;
  $("caja").innerHTML="<h3>Administrador</h3>"+(SB_URL?"<label>Correo</label><input id='em' type='email'>":"")+"<label>Contraseña</label><input id='pw' type='password'><p class='f' id='err'></p><div class='row'><button class='b p' id='ok'>Entrar</button><button class='b' id='no'>Cancelar</button></div>";
  $("modal").classList.add("on");$("no").onclick=cerrar;
  $("ok").onclick=async()=>{
  if(SB_URL){try{const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value})});const j=await r.json().catch(()=>({}));if(j.access_token){TOK=j.access_token;admin=true;cerrar();pinta();}else $("err").textContent=r.status===400?"Correo o contraseña incorrectos.":"Error "+r.status+": "+(j.msg||j.error_description||"respuesta inesperada. Revisa SB_URL y SB_KEY.");}catch(e){$("err").textContent="No se pudo conectar. Revisa que SB_URL empiece por https:// y acabe en .supabase.co. Detalle: "+e.message;}return;}
  };};
$("cartbtn").onclick=()=>{
  $("cartel").innerHTML=(D._cfg.logo?"<img class='lo' src='"+esc(D._cfg.logo)+"' alt=''>":"")+"<h1>"+esc(D._cfg.nombre)+"</h1><h2>"+t("esc")+"</h2><div id='qrbig' style='display:inline-block;padding:12px'></div>";
  try{new QRCode($("qrbig"),{text:location.href.split("#")[0],width:320,height:320});}catch(e){}
  setTimeout(()=>window.print(),300);};
async function exportar(){
  const c=document.documentElement.cloneNode(true);
  ["nav","main","qrbox","bar","caja","hdr","cartel","toast"].forEach(id=>c.querySelector("#"+id).innerHTML="");
  c.querySelector("#modal").className="";c.querySelector("#zoom").className="";c.querySelector("#zoom").innerHTML="";
  c.querySelector("#datos").textContent=JSON.stringify(D).replace(/</g,"\\u003c");
  const html="<!DOCTYPE html>\n"+c.outerHTML;
  try{if(window.claude){const d=await claude.use("downloads");if(d){await d.save({filename:"index.html",data:new Blob([html],{type:"text/html"})});return;}}}catch(e){}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download="index.html";document.body.appendChild(a);a.click();a.remove();}
const m=location.hash.slice(1).toLowerCase().match(/^([a-z]+)(?:-(\d+))?$/);
if(m){const i=NOMBRES.findIndex(n=>n.toLowerCase()===m[1]);if(i>=0){cur=i;if(m[2]&&D[NOMBRES[i]][+m[2]-1])ver=+m[2]-1;}}
pinta();
if(SB_URL)carga();
try{new QRCode($("qrbox"),{text:location.href.split("#")[0],width:180,height:180});}catch(e){}
</script>
